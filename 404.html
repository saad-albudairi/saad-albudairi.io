<script>try{if(localStorage.getItem('sab-theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<style>
:root{--bg:#0A1120;--card:#101A2D;--fg:#E8EEF8;--muted:#93A1B8;--blue:#3D7BFF;--line:rgba(122,165,255,.18);--jacket:#1B2740;color-scheme:dark}
html[data-theme="light"]{--bg:#F2F5FA;--card:#FFFFFF;--fg:#0E1A33;--muted:#526079;--blue:#1F5FE0;--line:rgba(20,50,110,.15);--jacket:#2A3754;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(70% 60% at 50% 40%,rgba(61,123,255,.14),transparent 70%),var(--bg);color:var(--fg);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;padding:24px 16px;text-align:center}
main{max-width:560px;width:100%}
.code{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:clamp(72px,18vw,128px);line-height:1;letter-spacing:.06em;color:var(--blue);direction:ltr}
svg.cable{width:100%;max-width:520px;height:auto;display:block;margin:6px auto 4px;direction:ltr}
.l{animation:wig 3s ease-in-out infinite;transform-origin:0 60px}
.r{animation:wig 3s ease-in-out infinite reverse;transform-origin:520px 60px}
@keyframes wig{50%{transform:rotate(-1.6deg)}}
.spark{animation:sp 1.1s steps(2) infinite;transform-origin:260px 60px}
.spark.b{animation-delay:.35s}.spark.c{animation-delay:.7s}
@keyframes sp{0%{opacity:0;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}100%{opacity:0}}
h1{font-family:"Noto Kufi Arabic",sans-serif;font-weight:800;font-size:clamp(22px,5vw,30px);margin:8px 0 6px}
p{color:var(--muted);line-height:1.8;margin:0 auto 22px;max-width:42ch}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;text-decoration:none;padding:12px 22px;border-radius:12px}
.solid{background:var(--blue);color:#fff}
.wa{background:#25d366;color:#062b14}
.line{border:1px solid var(--line);color:var(--fg);background:var(--card)}
.brand{margin-top:28px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.l,.r,.spark{animation:none}}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <svg class="cable" viewBox="0 0 520 120" aria-hidden="true">
    <g class="l">
      <rect x="0" y="44" width="200" height="32" rx="16" fill="var(--jacket)"/>
      <rect x="0" y="44" width="200" height="8" rx="4" fill="#fff" opacity=".06"/>
      <rect x="196" y="48" width="18" height="24" rx="6" fill="#1B1C1F"/>
      <g stroke-linecap="round" stroke-width="5"><path d="M214 53 L238 47" stroke="#d23b30"/><path d="M214 60 L242 60" stroke="#E09A68"/><path d="M214 67 L236 74" stroke="#2f6fd1"/></g>
    </g>
    <g class="r">
      <rect x="320" y="44" width="200" height="32" rx="16" fill="var(--jacket)"/>
      <rect x="320" y="44" width="200" height="8" rx="4" fill="#fff" opacity=".06"/>
      <rect x="306" y="48" width="18" height="24" rx="6" fill="#1B1C1F"/>
      <g stroke-linecap="round" stroke-width="5"><path d="M306 53 L282 46" stroke="#d23b30"/><path d="M306 60 L278 61" stroke="#E09A68"/><path d="M306 67 L284 75" stroke="#2f6fd1"/></g>
    </g>
    <g fill="none" stroke="#FFD34D" stroke-width="3" stroke-linecap="round">
      <path class="spark" d="M252 50 l6 8 -5 3 9 9"/>
      <path class="spark b" d="M266 44 l-4 9 6 2 -5 10"/>
      <path class="spark c" d="M258 72 l5 -6 4 5 5 -7"/>
    </g>
  </svg>
  <h1>انقطع الكيبل! ⚡</h1>
  <p>الصفحة اللي تدوّر عليها مو موجودة، يمكن الرابط غلط أو انتقلت. ارجع للرئيسية ونوصلك للي تريده.</p>
  <div class="btns">
    <a class="btn solid" href="/saad-albudairi.io/">ارجع للرئيسية</a>
    <a class="btn line" href="/saad-albudairi.io/#products">الأنواع والقياسات</a>

  </div>
  <div class="brand">سعد البديري للكيبلات · الشورجة، بغداد · منذ 1991</div>
</main>
</body>
</html>
